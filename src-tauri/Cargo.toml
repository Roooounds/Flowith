[package]
name = "flowith"
version = "1.0.0"
description = "Node-based Multi-Agent AI Project Management Workflow"
authors = ["Flowith"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "boss_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json", "native-tls"] }
log = "0.4"
base64 = "0.22"
rand = "0.8"
dirs-next = "2"
sysinfo = "0.31"
fs2 = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
