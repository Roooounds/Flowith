<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Flowith Icon Preview</title>
<style>
  body { margin:0; padding:40px; background:#1a1a2e; font-family:system-ui; color:#eee; }
  h2 { color:#a5b4fc; margin-top:30px; }
  .row { display:flex; gap:30px; align-items:center; flex-wrap:wrap; }
  .card { text-align:center; }
  .card span { display:block; margin-top:8px; font-size:12px; color:#888; }
  .bg-light { background:#f8f8f8; padding:20px; border-radius:16px; display:inline-block; margin:10px; }
  .bg-dark { background:#1e1e2e; padding:20px; border-radius:16px; display:inline-block; margin:10px; }
  .dock { background:rgba(255,255,255,0.1); border-radius:20px; padding:12px 20px; display:inline-flex; gap:16px; align-items:center; }
</style></head>
<body>
<h1>Flowith Icon</h1>
<p>Check how it reads at different sizes and contexts.</p>

<h2>macOS Dock (light bg)</h2>
<div class="bg-light">
  <div class="row">
    <div class="card"><img src="src-tauri/icons/32x32.png" width="32"><span>32px</span></div>
    <div class="card"><img src="src-tauri/icons/128x128.png" width="64"><span>Dock~64</span></div>
    <div class="card"><img src="src-tauri/icons/128x128@2x.png" width="128"><span>128px</span></div>
  </div>
</div>

<h2>Dark mode (Finder sidebar etc)</h2>
<div class="bg-dark">
  <div class="row">
    <div class="card"><img src="src-tauri/icons/32x32.png" width="16"><span>16px</span></div>
    <div class="card"><img src="src-tauri/icons/32x32.png" width="32"><span>32px</span></div>
    <div class="card"><img src="src-tauri/icons/128x128.png" width="128"><span>128px</span></div>
  </div>
</div>

<h2>Full size (512px)</h2>
<img src="src-tauri/icons/icon_512x512.png" width="512">

</body>
</html>
