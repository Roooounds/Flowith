name: Bug Report
description: Report a bug to help us improve Flowith
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below so we can reproduce and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Open Flowith
        2. Create a workflow with ...
        3. Click on ...
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened. Include any error messages or screenshots.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain the problem.

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows
        - Linux
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Flowith Version
      description: "e.g. v1.0.0 (check the launcher or About screen)"
    validations:
      required: true

  - type: dropdown
    id: llm
    attributes:
      label: LLM Provider
      description: Which model provider were you using when the bug occurred?
      options:
        - Ollama (local)
        - OpenAI
        - Anthropic
        - Gemini
        - Custom API
        - Mock mode
        - N/A

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context about the problem (logs, console output, workflow JSON export, etc.)
