name: Feature Request
description: Suggest a new feature or improvement for Flowith
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make Flowith better? We'd love to hear it. Please describe the problem you're trying to solve — understanding the "why" helps us design a better solution.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? Describe the pain point or workflow gap.
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature or change you'd like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've thought about.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of Flowith does this relate to?
      options:
        - Canvas / Workflow Editor
        - Node Types / Execution Engine
        - LLM Integration / Model Support
        - Knowledge Base
        - Output Preview
        - UI / UX
        - Launcher / Setup
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Screenshots, mockups, links to similar tools, or any other context.
